<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Your guide · Kipworth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#F7F6FC;--card:#FFFFFF;--ink:#1D2145;--muted:#5D6184;--line:#E4E2F0;--lav:#6A5AE0;--lav-soft:#ECE8FF;
  --fd:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--fb:"Inter","Segoe UI",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.5;
  padding:28px max(18px,env(safe-area-inset-right)) 40px max(18px,env(safe-area-inset-left))}
main{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.small{font-size:14px;font-weight:600;color:var(--lav);letter-spacing:.01em}
h1{font-family:var(--fd);font-weight:800;font-size:40px;line-height:1;letter-spacing:-.02em}
.feat{background:var(--card);border-radius:22px;overflow:hidden;box-shadow:0 12px 32px rgba(29,33,69,.12);display:flex;flex-direction:column}
.feat img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.fb{padding:18px 20px 20px;display:flex;flex-direction:column;gap:12px}
.tag{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--lav-soft);color:var(--lav);border-radius:999px;padding:5px 11px}
.feat h2{font-family:var(--fd);font-weight:800;font-size:26px;line-height:1.08;letter-spacing:-.01em}
.feat p{color:var(--muted);font-size:16px}
.btn{display:block;text-align:center;text-decoration:none;background:var(--ink);color:#fff;font-weight:600;font-size:17px;border-radius:999px;padding:15px 18px}
.btn:active,.btn:hover{background:var(--lav)}
.fine{font-size:13px;color:var(--muted);text-align:center}
.more{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:20px;margin-top:6px}
.more h3{font-family:var(--fd);font-weight:700;font-size:18px}
.mini{display:grid;grid-template-columns:104px 1fr;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;text-decoration:none;color:inherit}
.mini img{width:104px;height:78px;object-fit:cover;border-radius:10px;display:block}
.mini div{min-width:0;display:flex;flex-direction:column;gap:4px}
.mini b{font-size:15px;line-height:1.25}
.mini span{font-size:13px;color:var(--muted);line-height:1.35}
.mini em{font-style:normal;font-size:13px;font-weight:600;color:var(--lav)}
footer{border-top:1px solid var(--line);padding-top:20px;margin-top:6px;display:flex;flex-direction:column;gap:6px;text-align:center;font-size:14px;color:var(--muted)}
footer b{font-family:var(--fd);font-size:17px;color:var(--ink)}
</style>
</head>
<body>
<main>
  <div class="small">You're in. Here it is.</div>
  <h1>Your guide</h1>
  <div id="featured"></div>
  <section class="more" id="more-wrap">
    <h3>More from Kipworth</h3>
    <div id="more"></div>
  </section>
  <footer>
    <span>Every new guide lands here, and in our weekly email.</span>
    <b>Sleep well. Or at least, sleep.</b>
    <span>@kipworth.sleep</span>
  </footer>
</main>
<script>
// Les guides, le plus récent en premier. Ajouter un guide = ajouter une ligne ici (21/11).
var GUIDES = [
  {key:"2am", title:"Why He Comes and Finds You in the Night",
   feat:"Five things that worked for real UK parents, and what they told their kid.",
   small:"For the middle of the night: five things that worked for real UK parents.",
   pdf:"/Why-He-Comes-And-Finds-You.pdf", img:"img/2am.jpg", fine:"7 pages. Save it to your phone, so it's there at 2am."},
  {key:"bedtime", title:"Why Nobody's Asleep Yet",
   feat:"Four bedtime battles, why each one happens, and one thing to try tonight for each.",
   small:"For bedtime itself: four battles, and one thing to try tonight for each.",
   pdf:"/Why-Nobodys-Asleep-Yet.pdf", img:"img/bedtime.jpg", fine:"7 pages. Save it to your phone."}
];
var g = new URLSearchParams(location.search).get("g");
var star = GUIDES.filter(function(x){return x.key === g;})[0] || GUIDES[0];
var others = GUIDES.filter(function(x){return x !== star;});
function el(tag, cls, text){var e=document.createElement(tag); if(cls) e.className=cls; if(text) e.textContent=text; return e;}
var f = el("article","feat");
var im = el("img"); im.src = star.img; im.alt = ""; f.appendChild(im);
var fb = el("div","fb");
if (g && star.key === g) fb.appendChild(el("span","tag","From the Reel you just watched"));
fb.appendChild(el("h2","",star.title));
fb.appendChild(el("p","",star.feat));
var a = el("a","btn","Open your guide"); a.href = star.pdf; fb.appendChild(a);
fb.appendChild(el("p","fine",star.fine));
f.appendChild(fb);
document.getElementById("featured").appendChild(f);
var more = document.getElementById("more");
others.slice(0,3).forEach(function(x){
  var m = el("a","mini"); m.href = x.pdf;
  var i = el("img"); i.src = x.img; i.alt = ""; m.appendChild(i);
  var d = el("div"); d.appendChild(el("b","",x.title)); d.appendChild(el("span","",x.small)); d.appendChild(el("em","","Open this one"));
  m.appendChild(d); more.appendChild(m);
});
if (!others.length) document.getElementById("more-wrap").style.display = "none";
</script>
</body>
</html>
