<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Your guide · Kipworth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Oswald:wght@600&display=swap" rel="stylesheet">
<style>
/* DA du carrousel v10 validé le 21/11 : lavande, Patrick Hand, KIPWORTH en Oswald, surligneur, dessins au crayon. */
*{box-sizing:border-box;margin:0;padding:0}
body{background:#DCD5FA;color:#1E2559;font-family:'Patrick Hand',cursive;font-size:20px;line-height:1.25;
  padding:22px max(20px,env(safe-area-inset-right)) 36px max(20px,env(safe-area-inset-left))}
main{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:18px;position:relative}
.brand{text-align:center;font-family:'Oswald',sans-serif;font-weight:600;font-size:14px;letter-spacing:.06em}
.moon{position:absolute;right:-4px;top:26px;width:118px;transform:rotate(3deg)}
.k{font-size:24px;transform:rotate(-1.5deg);transform-origin:left;margin-top:58px}
h1{font-weight:400;font-size:58px;line-height:.95;margin-top:-6px}
.m{background-image:linear-gradient(#B9A7F5,#B9A7F5);background-repeat:no-repeat;background-size:100% 36%;background-position:0 86%;padding:0 4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.feat{display:flex;flex-direction:column;gap:14px;margin-top:4px}
.feat a.cov{display:block;align-self:center;width:78%;transform:rotate(-1.5deg)}
.feat a.cov img{width:100%;display:block;border-radius:6px;box-shadow:0 10px 26px rgba(30,37,89,.22)}
.tag{align-self:flex-start;font-size:19px;background:#1E2559;color:#DCD5FA;border-radius:999px;padding:2px 12px}
.feat h2{font-weight:400;font-size:34px;line-height:1}
.feat p{font-size:22px}
.btn{display:block;text-align:center;text-decoration:none;background:#1E2559;color:#FFFFFF;font-size:26px;border-radius:14px;padding:12px 16px;transform:rotate(-.6deg)}
.btn:active,.btn:hover{background:#3B3F8F}
.fine{font-size:18px;opacity:.75;text-align:center}
.more{display:flex;flex-direction:column;gap:12px;border-top:2px dashed rgba(30,37,89,.25);padding-top:18px;margin-top:8px}
.more h3{font-weight:400;font-size:28px}
.mini{display:grid;grid-template-columns:92px 1fr;gap:14px;align-items:center;text-decoration:none;color:inherit;background:rgba(255,255,255,.45);border-radius:14px;padding:10px}
.mini img{width:92px;height:70px;object-fit:cover;border-radius:8px;display:block}
.mini div{min-width:0;display:flex;flex-direction:column;gap:2px}
.mini b{font-weight:400;font-size:22px;line-height:1.05}
.mini span{font-size:17px;opacity:.85}
.mini em{font-style:normal;font-size:18px;text-decoration:underline}
footer{border-top:2px dashed rgba(30,37,89,.25);padding-top:18px;margin-top:8px;display:flex;flex-direction:column;gap:6px;text-align:center;font-size:19px}
footer b{font-weight:400;font-size:28px}
</style>
</head>
<body>
<main>
  <div class="brand">KIPWORTH</div>
  <img class="moon" src="img/house.png" alt="">
  <div class="k">You're in. Here it is.</div>
  <h1>Your <span class="m">guide</span></h1>
  <div id="featured"></div>
  <section class="more" id="more-wrap">
    <h3>More from Kipworth</h3>
    <div id="more"></div>
  </section>
  <footer>
    <span>Every new guide lands here, and in our weekly email.</span>
    <b><span class="m">Sleep well. Or at least, sleep.</span></b>
    <span>@kipworth.sleep</span>
  </footer>
</main>
<script>
// Les guides, le plus récent en premier. Ajouter un guide = ajouter une ligne ici (21/11).
var GUIDES = [
  {key:"guide", title:"Will He Ever Just Stay in Bed?",
   feat:"Five moments of the evening, and what real UK parents did at each one.",
   small:"Five moments of the evening, and what real UK parents did at each one.",
   pdf:"/Kipworth-Bedtime-Guide.pdf", img:"img/guide-cover.jpg", fine:"9 pages. Save it to your phone."}
];
var g = new URLSearchParams(location.search).get("g");
var star = GUIDES.filter(function(x){return x.key === g;})[0] || GUIDES[0];
var others = GUIDES.filter(function(x){return x !== star;});
function el(tag, cls, text){var e=document.createElement(tag); if(cls) e.className=cls; if(text) e.textContent=text; return e;}
var f = el("article","feat");
if (g && star.key === g) f.appendChild(el("span","tag","From the Reel you just watched"));
var cv = el("a","cov"); cv.href = star.web || star.pdf; var im = el("img"); im.src = star.img; im.alt = star.title; cv.appendChild(im); f.appendChild(cv);
var a = el("a","btn","Open your guide"); a.href = star.web || star.pdf; f.appendChild(a);
f.appendChild(el("p","fine",star.fine));
document.getElementById("featured").appendChild(f);
var more = document.getElementById("more");
others.slice(0,3).forEach(function(x){
  var m = el("a","mini"); m.href = x.web || x.pdf;
  var i = el("img"); i.src = x.img; i.alt = ""; m.appendChild(i);
  var d = el("div"); d.appendChild(el("b","",x.title)); d.appendChild(el("span","",x.small)); d.appendChild(el("em","","Open this one"));
  m.appendChild(d); more.appendChild(m);
});
if (!others.length) document.getElementById("more-wrap").style.display = "none";
</script>
</body>
</html>
